  <title>随风轻摆的斜垂柳枝</title>
  <defs>
    <linearGradient id="leaf-wash" x1="0" y1="-8" x2="60" y2="8" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4a826a" stop-opacity=".62"/>
      <stop offset=".55" stop-color="#8ca67b" stop-opacity=".55"/>
      <stop offset="1" stop-color="#d5ddb0" stop-opacity=".4"/>
    </linearGradient>
    <g id="willow-leaf">
      <path d="M0 0C17-12 43-9 60 4C38 9 14 12 0 0Z" fill="url(#leaf-wash)" stroke="#5a8166" stroke-opacity=".46" stroke-width=".8"/>
      <path d="M0 0Q30 3 57 4" stroke="#f2ffe4" stroke-opacity=".75" stroke-width=".9"/>
    </g>
  </defs>
  <style>
    .willow-stem{stroke:#5e896e;stroke-opacity:.65;stroke-width:1.6;stroke-linecap:round}
    .willow-branch{transform-origin:var(--anchor);animation:willow-wind var(--sway-time) ease-in-out var(--sway-delay) infinite}
    .willow-branch:nth-of-type(even){animation-direction:reverse}
    @keyframes willow-wind{
      0%,100%{transform:rotate(-2.2deg) skewX(-.55deg)}
      38%{transform:rotate(2.5deg) skewX(.85deg)}
      68%{transform:rotate(.25deg) skewX(-.35deg)}
    }
    @media(prefers-reduced-motion:reduce){.willow-branch{animation:none}}
  </style>
